name: Runtime proof

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: runtime-proof-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: Linux x64 runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUNTIME_PROOF_HOST_SCOPE: prepared-runner
      RUNTIME_PROOF_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true
          persist-credentials: false
      - name: Set up project-tooling Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install native addon libraries and archive tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap ffmpeg fuse3 xz-utils
      - name: Install project metadata without lifecycle hooks
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare an agent-store mount point
        run: |
          sudo mkdir -p /cursor/stores
          sudo chown "$(id -u):$(id -g)" /cursor /cursor/stores
          grep -qx 'user_allow_other' /etc/fuse.conf 2>/dev/null || echo user_allow_other | sudo tee -a /etc/fuse.conf >/dev/null
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Compile TypeScript
        run: node --experimental-strip-types tools/compile.ts
      - name: Check the executable host contract
        run: node dist/project/tools/preflight-host.js --profile supported --scope prepared-runner
      - name: Build the installed runtime
        run: node dist/project/tools/build.js
      - name: Provision locked runtime tools
        id: provision
        run: node dist/project/tools/provision-runtime-tools.js --profile supported
      - name: Create proof report directory
        if: "${{ !cancelled() && steps.provision.outcome == 'success' }}"
        run: mkdir -p proof-reports
      - name: Native addons and PTY output
        if: "${{ !cancelled() && steps.provision.outcome == 'success' }}"
        run: node --test --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=proof-reports/native-pty.junit.xml dist/project/tests/live/native-runtime.test.js dist/project/tests/live/pty-runtime.test.js
      - name: Launcher and bundled tool behavior
        if: "${{ !cancelled() && steps.provision.outcome == 'success' }}"
        run: node --test --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=proof-reports/launcher-tools.junit.xml dist/project/tests/live/daemon-runtime.test.js dist/project/tests/live/bundled-tools.test.js dist/project/tests/live/ripgrep-runtime.test.js
      - name: HTTP and PTY authentication
        if: "${{ !cancelled() && steps.provision.outcome == 'success' }}"
        run: node --test --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=proof-reports/server.junit.xml dist/project/tests/live/server-runtime.test.js dist/project/tests/live/pty-auth-runtime.test.js
      - name: Sandbox filesystem and network confinement
        if: "${{ !cancelled() && steps.provision.outcome == 'success' }}"
        run: node --test --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=proof-reports/sandbox.junit.xml dist/project/tests/live/sandbox-runtime.test.js
      - name: Agent Store FUSE mount
        if: "${{ !cancelled() && steps.provision.outcome == 'success' }}"
        run: node --test --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=proof-reports/agent-store.junit.xml dist/project/tests/live/agent-store-runtime.test.js
      - name: Cgroup resource reporting
        if: "${{ !cancelled() && steps.provision.outcome == 'success' }}"
        run: node --test --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=proof-reports/cgroup.junit.xml dist/project/tests/live/cgroup-runtime.test.js
      - name: Shutdown and restart lifecycle
        if: "${{ !cancelled() && steps.provision.outcome == 'success' }}"
        run: node --test --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=proof-reports/shutdown.junit.xml dist/project/tests/live/shutdown-runtime.test.js
      - name: Write the runtime conformance record
        if: always()
        run: |
          node dist/project/tools/emit-runtime-proof.js \
            --report 'Native addons and PTY output=proof-reports/native-pty.junit.xml' \
            --report 'Launcher and bundled tool behavior=proof-reports/launcher-tools.junit.xml' \
            --report 'HTTP and PTY authentication=proof-reports/server.junit.xml' \
            --report 'Sandbox filesystem and network confinement=proof-reports/sandbox.junit.xml' \
            --report 'Agent Store FUSE mount=proof-reports/agent-store.junit.xml' \
            --report 'Cgroup resource reporting=proof-reports/cgroup.junit.xml' \
            --report 'Shutdown and restart lifecycle=proof-reports/shutdown.junit.xml' \
            --output runtime-proof.json
      - name: Upload the runtime conformance record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-proof
          path: runtime-proof.json
          if-no-files-found: error
