name: Runtime proof

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: runtime-proof-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: Linux x64 runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true
          persist-credentials: false
      - name: Set up project-tooling Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install project metadata without lifecycle hooks
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare Ubuntu 24.04 supported host
        run: deploy/bootstrap-supported-host.sh
      - name: Compile TypeScript
        run: node --experimental-strip-types tools/compile.ts
      - name: Verify supported host prerequisites
        run: node dist/project/tools/preflight-host.js --profile supported --scope prepared-runner
      - name: Build installed runtime
        run: node dist/project/tools/build.js
      - name: Provision locked runtime tools
        run: node dist/project/tools/provision-runtime-tools.js --profile supported
      - name: Load native addons and open a PTY
        run: node --test --test-reporter=spec dist/project/tests/live/native-runtime.test.js dist/project/tests/live/pty-runtime.test.js
      - name: Run launcher and locked command-line tools
        run: node --test --test-reporter=spec dist/project/tests/live/daemon-runtime.test.js dist/project/tests/live/bundled-tools.test.js dist/project/tests/live/ripgrep-runtime.test.js
      - name: Expose Origin through daemon PTY
        run: node --test --test-reporter=spec dist/project/tests/live/origin-runtime.test.js
      - name: Authenticate HTTP and PTY listeners
        run: node --test --test-reporter=spec dist/project/tests/live/server-runtime.test.js dist/project/tests/live/pty-auth-runtime.test.js
      - name: Enforce sandbox filesystem and network isolation
        run: node --test --test-reporter=spec dist/project/tests/live/sandbox-runtime.test.js
      - name: Mount Agent Store with mock backend
        run: node --test --test-reporter=spec dist/project/tests/live/agent-store-runtime.test.js
      - name: Exercise Agent Store direct protocol
        run: node --test --test-reporter=spec dist/project/tests/live/agent-store-direct.test.js
      - name: Report cgroup v2 resource limits
        run: node --test --test-reporter=spec dist/project/tests/live/cgroup-runtime.test.js
      - name: Shutdown without affecting unrelated processes
        run: node --test --test-reporter=spec dist/project/tests/live/shutdown-runtime.test.js
