name: Runtime proof

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: runtime-proof-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: Linux x64 runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true
          persist-credentials: false
      - name: Set up project-tooling Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install native addon libraries and archive tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap ffmpeg fuse3 xz-utils
      - name: Install project metadata without lifecycle hooks
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare an agent-store mount point
        run: |
          sudo mkdir -p /cursor/stores
          sudo chown "$(id -u):$(id -g)" /cursor /cursor/stores
          grep -qx 'user_allow_other' /etc/fuse.conf 2>/dev/null || echo user_allow_other | sudo tee -a /etc/fuse.conf >/dev/null
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Check the executable host contract
        run: npm run preflight -- --profile supported
      - name: Build the installed runtime
        run: npm run build
      - name: Provision locked runtime tools
        run: npm run provision -- --profile supported
      - name: Prove native, PTY, ripgrep, CLI, sandbox, Origin, tmux, and agent-store behavior
        run: |
          set -o pipefail
          npm run test:live | tee "${RUNNER_TEMP}/live.tap"
      - name: Write the runtime conformance record
        run: npm run proof:emit -- --tap "${RUNNER_TEMP}/live.tap" --output runtime-proof.json
      - name: Upload the runtime conformance record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-proof
          path: runtime-proof.json
          if-no-files-found: error
