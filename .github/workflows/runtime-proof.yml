name: Runtime proof

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: runtime-proof-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: Linux x64 runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up project-tooling Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install native addon libraries and archive tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg xz-utils
      - name: Install project metadata without lifecycle hooks
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the installed runtime
        run: npm run build
      - name: Provision locked runtime tools
        run: npm run provision -- --profile supported
      - name: Prove native, PTY, ripgrep, CLI and sandbox behavior
        run: npm run test:live
