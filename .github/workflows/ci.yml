name: Project checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: project-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }} / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true
          persist-credentials: false
      - name: Set up project-tooling Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install project metadata without lifecycle hooks
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile TypeScript
        run: node --experimental-strip-types tools/compile.ts
      - name: Check strict types and module boundaries
        run: node dist/project/tools/typecheck.js
      - name: Check generated protocol contracts
        run: node dist/project/tools/generate-proto-contracts.js --check
      - name: Verify pinned snapshot
        run: node dist/project/tools/verify-snapshot.js
      - name: Check JavaScript and launcher syntax
        run: node dist/project/tools/check-syntax.js
      - name: Prepare test capsule and module scopes
        run: node dist/project/tools/prepare-tests.js
      - name: Test offline runtime contracts
        run: node --experimental-test-module-mocks --test --test-concurrency=2 --test-reporter=spec dist/project/tests/*.test.js
      - name: Build installed runtime
        run: node dist/project/tools/build.js
      - name: Verify installed artifact
        run: node dist/project/tools/verify-build.js
      - name: Ensure generated files did not change the checkout
        run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"
