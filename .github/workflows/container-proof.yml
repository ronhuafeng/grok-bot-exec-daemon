name: Container proof

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: container-proof-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true
          persist-credentials: false
      - name: Set up project-tooling Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install project metadata without lifecycle hooks
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile TypeScript
        run: node --experimental-strip-types tools/compile.ts
      - name: Build the core image from the locked manifests
        run: docker build -f deploy/Dockerfile -t exec-daemon-core:local .
      - name: Prove the read-only core image
        run: node --test --test-reporter=spec dist/project/tests/container/core-image.test.js
        env:
          EXEC_DAEMON_IMAGE: exec-daemon-core:local
